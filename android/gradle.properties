org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=3G -XX:ReservedCodeCacheSize=512m -Dkotlin.daemon.jvm.options\="-Xmx3G" -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true

org.gradle.daemon=true
org.gradle.parallel=true
# DISABLED DELIBERATELY — do not turn back on without reading this.
#
# With the build cache on, release builds silently shipped an APK containing
# only the project's own dex (~3.7 MB, 3153 classes). The 28 MB of external
# library dex produced by mergeExtDexRelease was built but never packaged, so
# every Firebase/GMS implementation class was missing from the APK. The app
# then died at launch on every device with:
#
#   java.lang.RuntimeException: Unable to get provider
#   com.google.firebase.provider.FirebaseInitProvider:
#   java.lang.ClassNotFoundException
#
# Debug builds were unaffected, and `flutter clean` did NOT fix it — the bad
# output was restored from the global cache at ~/.gradle/caches/build-cache-1,
# which produced byte-identical broken APKs. Building with --no-build-cache
# restored the full 30.6 MB / 27934-class dex.
#
# A correctness bug that only shows up in release builds is not worth the
# saved build time. If you re-enable this, verify before every release that
# the APK has >25 MB of dex:
#   unzip -l app-release.apk | grep '\.dex'
org.gradle.caching=false
org.gradle.workers.max=2

kotlin.incremental=false